name: CepAsistan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: AI sunucusu testlerini çalıştır
        run: |
          if [ -f worker/test.mjs ]; then
            node worker/test.mjs
          else
            echo "worker/ klasörü depoda yok, sunucu testi atlandı."
          fi

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümünü kontrol et
        run: flutter --version

      - name: Flutter projesini oluştur
        run: flutter create --org com.cepasistan --project-name cep_asistan _build

      - name: Uygulama kodunu ve ayarları aktar
        run: |
          cp lib/main.dart _build/lib/main.dart
          cp pubspec.yaml _build/pubspec.yaml

      - name: Android bildirim derleme ayarını yap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_dir = Path("_build/android/app")
          kts_file = app_dir / "build.gradle.kts"
          gradle_file = app_dir / "build.gradle"

          if kts_file.exists():
              gradle_file = kts_file
              enabled_setting = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled_setting = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          content = gradle_file.read_text()

          if "compileOptions {" not in content:
              raise SystemExit(f"compileOptions bloğu bulunamadı: {gradle_file}")

          if enabled_setting not in content:
              content = content.replace(
                  "compileOptions {",
                  f"compileOptions {{\n        {enabled_setting}",
                  1,
              )

          if dependency not in content:
              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {",
                      f"dependencies {{\n    {dependency}",
                      1,
                  )
              else:
                  content += f"\ndependencies {{\n    {dependency}\n}}\n"

          gradle_file.write_text(content)
          PY

      - name: Android manifest ayarlarını yap (izinler ve bildirim alıcıları)
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("_build/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]
          perm_xml = ""
          for name in permissions:
              if f'android:name="{name}"' not in text:
                  perm_xml += f'    <uses-permission android:name="{name}" />\n'

          if perm_xml:
              match = re.search(r"<manifest[^>]*>\n?", text)
              if not match:
                  raise SystemExit("manifest etiketi bulunamadi")
              text = text[: match.end()] + perm_xml + text[match.end():]

          receivers = """        <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                      android:exported="false" />
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          """

          if "ScheduledNotificationReceiver" not in text:
              if "</application>" not in text:
                  raise SystemExit("application kapanisi bulunamadi")
              text = text.replace("</application>", receivers + "    </application>", 1)

          manifest.write_text(text)
          print("Manifest guncellendi")
          PY

      - name: Paketleri kur
        working-directory: _build
        run: flutter pub get

      - name: Kod analizi
        working-directory: _build
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: AI sunucu adresini hazırla
        id: defines
        env:
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
        run: |
          if [ -n "$AI_ENDPOINT" ]; then
            echo "args=--dart-define=AI_ENDPOINT=$AI_ENDPOINT" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Android APK oluştur
        working-directory: _build
        run: flutter build apk --debug ${{ steps.defines.outputs.args }}

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: CepAsistan-Android-APK
          path: _build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
